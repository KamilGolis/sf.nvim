name: CI

on:
  pull_request:
    branches: [main, develop, feature/*, bug/*, release/*]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stylua:
    name: StyLua format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin a StyLua release for reproducible checks.
          version: "2.0.0"
          args: --color always --check .

  luacheck:
    name: LuaCheck lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Add luarocks bin to PATH
        run: echo "$(luarocks config deploy_bin_dir)" >> "$GITHUB_PATH"
      - name: Run luacheck
        run: make luacheck

  test:
    name: Unit tests (mini.test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install test dependencies
        run: make deps
      - name: Run tests
        run: make test